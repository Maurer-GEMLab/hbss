[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbss"
version = "0.0.0.dev0"
description = "Hierarchical Bayesian state-space estimation for multi-sensor InSAR time series"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jeremy Maurer", email = "jmaurer@mst.edu" }]
keywords = ["InSAR", "geodesy", "Bayesian", "state-space", "Kalman"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# NOTE: torch must never appear here, or in anything reachable from here.
# The core-isolation CI job enforces this. See HBSS-dev-plan.md section 1.3.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "xarray>=2024.1",
    "zarr>=2.17",
    "pandas>=2.1",
    "h5py>=3.10",
    "jax>=0.4.30",
    "numpyro>=0.15",
    "pyyaml>=6",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "cartopy>=0.23"]

[project.scripts]
hbss = "hbss.cli:main"          # Phase 0
hbss-fetch = "hbss.io.fetch:main"  # Phase 0

[project.urls]
Repository = "https://github.com/OWNER/hbss"

[tool.hatch.build.targets.wheel]
packages = ["src/hbss"]
