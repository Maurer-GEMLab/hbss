# Dataset registry.
#
# Data never lives in the repository. This file maps logical names to a
# location, a checksum, and provenance; `hbss-fetch <name>` resolves an entry
# and populates $HBSS_DATA_ROOT.
#
# Add an entry the moment a dataset is first used, not later. The run ledger
# records the checksums of everything an inference run consumed, and that is
# only as good as this file.
#
# Storage location is a Phase 0 decision -- see HBSS-dev-plan.md section 3.

datasets: {}
